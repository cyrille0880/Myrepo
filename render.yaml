# Minimal Render service definition for a Node.js web app
# DO NOT commit actual DB credentials in this file.

services:
  - type: web
    name: myrepo-web
    env: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: ENABLE_SQL_LOGGING
        value: "false"

# Note: Set DB_URL as a secret in the Render dashboard, not in this file.
# Example DB_URL format:
# postgresql://username:password@host:5432/database
